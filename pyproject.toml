[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "choir2sheet"
version = "0.1.0"
description = "Audio to sheet music transcription pipeline"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
dependencies = [
    "demucs>=4.0.0",
    "basic-pitch>=0.3.0",
    "music21>=9.1.0",
    "requests>=2.28.0",
    "click>=8.1.0",
    "tqdm>=4.64.0",
    "soundfile>=0.12.0",
    "numpy>=1.23.0",
]

[project.scripts]
choir2sheet = "choir2sheet.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]
