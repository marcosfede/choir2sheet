[project]
name = "choir2sheet"
version = "0.1.0"
description = "Audio to sheet music transcription pipeline"
readme = "README.md"
requires-python = ">=3.10,<3.13"
license = {text = "MIT"}
dependencies = [
    "basic-pitch>=0.3.0",
    "music21>=9.1.0",
    "requests>=2.28.0",
    "click>=8.1.0",
    "tqdm>=4.64.0",
    "soundfile>=0.12.0",
    "numpy>=1.23.0",
    "pretty-midi>=0.2.10",
    "mir-eval>=0.7",
    "setuptools>=69,<70",  # resampy needs pkg_resources
]

[project.scripts]
choir2sheet = "choir2sheet.cli:main"

[project.optional-dependencies]
# Source separation (large download: ~1GB for Demucs models)
separation = ["demucs>=4.0.0"]
# FluidSynth for audio synthesis from MIDI
synth = ["pyfluidsynth>=1.3.0"]
# All optional deps
all = ["demucs>=4.0.0", "pyfluidsynth>=1.3.0"]
dev = ["pytest", "ruff"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.uv]
# Pin Python version for reproducibility
python-preference = "managed"

[tool.ruff]
line-length = 100
